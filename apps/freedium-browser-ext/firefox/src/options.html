<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Freedium options</title>
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <main>
      <h1>Freedium</h1>
      <p class="lead">
        The toolbar button opens the current page at this mirror. The mirror
        receives the page address, without a username, password, or fragment.
        Use https. http is only accepted on localhost.
      </p>
      <form id="mirror-form">
        <label for="mirror">Mirror</label>
        <input
          id="mirror"
          name="mirror"
          type="url"
          spellcheck="false"
          autocomplete="off"
          required
        />
        <div class="row">
          <button type="submit">Save</button>
          <button type="button" id="reset">Use default</button>
        </div>
        <p id="status" role="status"></p>
      </form>
    </main>
    <script src="rewrite.js"></script>
    <script src="options.js"></script>
  </body>
</html>
