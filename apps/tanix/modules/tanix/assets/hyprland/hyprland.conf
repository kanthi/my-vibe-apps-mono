# Tanix Hyprland configuration.
# Put here by Tanix at your first login. It is yours now: edit freely,
# Hyprland reloads it on save. Tanix will not overwrite it again.
# Reference: https://wiki.hypr.land/Configuring/

monitor = , preferred, auto, 1

$terminal = kitty
$fileManager = dolphin
$menu = hyprlauncher

# Bar, notifications, clipboard history.
# (The wallpaper is drawn by the tanix-wallpaper user service.)
exec-once = waybar
exec-once = mako
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store

env = XCURSOR_SIZE,24

general {
    gaps_in = 5
    gaps_out = 12
    border_size = 2
    col.active_border = rgba(5370d2ff) rgba(9db5f8ff) 45deg
    col.inactive_border = rgba(0a1030aa)
    resize_on_border = true
    layout = dwindle
}

decoration {
    rounding = 10
    inactive_opacity = 0.96

    shadow {
        enabled = true
        range = 12
        render_power = 3
        color = rgba(0a1030aa)
    }

    blur {
        enabled = true
        size = 4
        passes = 2
    }
}

animations {
    enabled = true
    bezier = tanix, 0.05, 0.9, 0.1, 1.05
    animation = windows, 1, 6, tanix
    animation = windowsOut, 1, 6, default, popin 80%
    animation = border, 1, 10, default
    animation = fade, 1, 6, default
    animation = workspaces, 1, 5, default
}

dwindle {
    pseudotile = true
    preserve_split = true
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    force_default_wallpaper = 0
}

input {
    follow_mouse = 1
    touchpad {
        natural_scroll = true
    }
}

# Keys. SUPER is the Windows / Command key.
$mod = SUPER

bind = $mod, Return, exec, $terminal
bind = $mod, Space, exec, $menu
bind = $mod, E, exec, $fileManager
bind = $mod, Q, killactive,
bind = $mod, F, fullscreen,
bind = $mod, T, togglefloating,
bind = $mod, P, pseudo,
bind = $mod, J, togglesplit,
bind = $mod, L, exec, loginctl lock-session
bind = $mod SHIFT, E, exec, uwsm stop

# Clipboard history, screenshots (to the clipboard).
bind = $mod, V, exec, cliphist list | fuzzel --dmenu | cliphist decode | wl-copy
bind = , Print, exec, grim -g "$(slurp)" - | wl-copy
bind = SHIFT, Print, exec, grim - | wl-copy

# Focus and move windows.
bind = $mod, left, movefocus, l
bind = $mod, right, movefocus, r
bind = $mod, up, movefocus, u
bind = $mod, down, movefocus, d
bind = $mod SHIFT, left, movewindow, l
bind = $mod SHIFT, right, movewindow, r
bind = $mod SHIFT, up, movewindow, u
bind = $mod SHIFT, down, movewindow, d

# Workspaces.
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9

# Move and resize with the mouse.
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

# Volume and brightness keys.
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = , XF86MonBrightnessUp, exec, brightnessctl set 5%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl set 5%-
