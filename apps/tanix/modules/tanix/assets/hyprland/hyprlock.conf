# Tanix lock screen.

background {
    path = @wallpaper@
    blur_passes = 2
}

label {
    text = $TIME
    color = rgb(ffffff)
    font_size = 72
    position = 0, 120
    halign = center
    valign = center
}

input-field {
    size = 300, 50
    outer_color = rgb(5370d2)
    inner_color = rgb(0a1030)
    font_color = rgb(ffffff)
    placeholder_text = Password
    position = 0, -60
    halign = center
    valign = center
}
