# "System" page of the Tanix installer.
#
# Every `id` here must have a matching branch in the installer module (see
# ../patches/tanix-installer.patch), because the id decides which lines are
# written to the installed configuration.nix. The ids listed in
# TANIX_SERVER_IDS in that patch are installed without a graphical interface.
#
# Reference: https://codeberg.org/Calamares/calamares/src/branch/calamares/src/modules/packagechooser/packagechooser.conf
mode: required
method: legacy

labels:
    step: "System"

default: plasma6

items:
    - id: plasma6
      packages: [ plasma6 ]
      name: "Desktop: KDE Plasma"
      description: "<html>The Tanix desktop: KDE Plasma arranged with a menu bar at the top and a dock at the bottom, with the Tanix wallpapers. It is built only from parts that ship with Plasma, so it stays fully adjustable in System Settings. Comes with Flatpak and the Flathub store in Discover. This is the desktop the live session runs.<br/><br/>Learn more at <a href=\"https://kde.org/plasma-desktop/\">kde.org/plasma-desktop</a></html>"
      screenshot: "images/plasma6.jpg"

    - id: hyprland
      packages: [ hyprland ]
      name: "Desktop: Hyprland"
      description: "<html>Hyprland is a dynamic tiling Wayland compositor with smooth animations. Windows are arranged for you and driven from the keyboard. Tanix sets it up ready to use: keyboard shortcuts, a bar, a lock screen, notifications, clipboard history and screenshots, all in Tanix colours. The setup is a text file you can change. Press Super+Space for the app launcher and Super+Return for a terminal.<br/><br/>Learn more at <a href=\"https://hypr.land/\">hypr.land</a></html>"
      screenshot: "images/hyprland.png"

    # The empty id is the minimal server (upstream's "no desktop").
    - id: ""
      packages: []
      name: "Server: Minimal"
      description: "<html>A minimal system with no desktop and no graphical programs: the base system, networking, and an SSH server that accepts keys only, guarded by fail2ban. Updates install themselves every night. Choose this for servers, or to build a custom setup by hand.<br/><br/>Everything can be changed after installation in /etc/nixos/configuration.nix.</html>"
      screenshot: "images/server.png"

    - id: server-web
      packages: [ server-web ]
      name: "Server: Web (Caddy)"
      description: "<html>The minimal server plus the Caddy web server. It serves the files you put in /var/www on port 80, starting with a Tanix welcome page. After installing, run <i>tanix-web-setup</i> to give it a domain name; Caddy then sets up HTTPS by itself.<br/><br/>Learn more at <a href=\"https://caddyserver.com/\">caddyserver.com</a></html>"
      screenshot: "images/server-web.png"

    - id: server-containers
      packages: [ server-containers ]
      name: "Server: Containers (Podman)"
      description: "<html>The minimal server plus Podman, for running containers. A docker-compatible <i>docker</i> command and podman-compose are included, so most Docker instructions work as written.<br/><br/>Learn more at <a href=\"https://podman.io/\">podman.io</a></html>"
      screenshot: "images/server-containers.png"

    - id: server-database
      packages: [ server-database ]
      name: "Server: Database (PostgreSQL)"
      description: "<html>The minimal server plus the PostgreSQL database. It accepts connections from this machine only until you open it up in /etc/nixos/configuration.nix.<br/><br/>Learn more at <a href=\"https://www.postgresql.org/\">postgresql.org</a></html>"
      screenshot: "images/server-database.png"

    - id: security
      packages: [ security ]
      name: "Security Edition"
      description: "<html>A minimal KDE Plasma desktop for security testing, in the spirit of Kali: hardened (AppArmor, random network addresses, no services listening), with its own red look. Tools are grouped by category, as in Kali's menu.<br/><br/><b>The tools have not been chosen yet.</b> For now this installs the minimal desktop only; the categories are in /etc/nixos/tanix/security.nix.</html>"
      screenshot: "images/security.png"
