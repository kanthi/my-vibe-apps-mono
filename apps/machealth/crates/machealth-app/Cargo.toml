[package]
name = "machealth-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "machealth"
path = "src/main.rs"

[dependencies]
futures = "0.3"
gpui = { version = "0.2.2", default-features = false, features = ["font-kit", "runtime_shaders"] }
machealth-core = { path = "../machealth-core" }
machealth-ui = { path = "../machealth-ui" }
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSStatusBar", "NSStatusItem", "NSStatusBarButton", "NSImage", "NSButton", "NSControl", "NSResponder", "NSView", "NSApplication"] }
objc2-foundation = { version = "0.3", features = ["NSString", "NSObject"] }
